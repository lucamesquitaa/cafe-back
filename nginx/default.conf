# Redireciona HTTP -> HTTPS
server {
    listen 80;
    server_name api.turify.com.br;

    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl;
    server_name api.turify.com.br;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.turify.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.turify.com.br/privkey.pem;

    # Segurança básica
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Limite upload (ajuste conforme necessário)
    client_max_body_size 50M;

    # =========================
    # CORS (AJUSTE SE PRECISAR)
    # =========================
    add_header 'Access-Control-Allow-Origin' 'https://www.turify.com.br' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;

    # Preflight (OPTIONS)
    if ($request_method = OPTIONS) {
        return 204;
    }

    # =========================
    # API (.NET no Docker)
    # =========================
    location / {
        proxy_pass http://turify_local:8080/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}